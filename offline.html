<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>partyrank — sem internet</title>
    <style>
      :root { color-scheme: dark }
      html, body { margin: 0; padding: 0; height: 100%; background: #0B0B14; color: #fafafa; font-family: system-ui, -apple-system, sans-serif }
      .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #c084fc, #f472b6, #fb923c); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; color: white; letter-spacing: -1.5px }
      .mark span { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400 }
      h1 { font-size: 22px; margin: 0; font-weight: 600 }
      p { color: rgba(250,250,250,0.55); margin: 0; max-width: 360px; line-height: 1.5; font-size: 15px }
      button { margin-top: 12px; padding: 12px 22px; border-radius: 999px; border: 0; background: linear-gradient(90deg, #c084fc, #f472b6, #fb923c); color: white; font-weight: 600; font-size: 14px; cursor: pointer }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">p<span>r</span></div>
      <h1>você ficou sem internet</h1>
      <p>guarde a noite: assim que voltar a conexão, o ranking ao vivo volta sozinho.</p>
      <button onclick="location.reload()">tentar de novo</button>
    </div>
  </body>
</html>
